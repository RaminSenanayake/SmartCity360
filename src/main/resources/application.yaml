spring:
  application:
    name: SmartCity360
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    url: jdbc:mysql://localhost:3306/smartcity360?createDatabaseIfNotExist=true
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  config:
    import:
      - optional:file:.env[.properties]
logging:
  level:
    org:
      springframework:
        jdbc: debug

energy-meter:
  encryption-key: ${ENERGY_METER_ENCRYPTION_KEY}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
